<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_14 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_14" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_14');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.querySelector('.timeline-canvas-container');
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Timeline State
let scrollX = 0;
let targetScrollX = 0;
let zoom = 1;
let targetZoom = 1;
let isDragging = false;
let startX = 0;

// Nodes data (conceptual)
const movieNodes = [
    { x: -50, y: 0, title: "Iron Man", year: "2008", phase: 1 },
    { x: -30, y: 5, title: "The Incredible Hulk", year: "2008", phase: 1 },
    { x: -10, y: -5, title: "Iron Man 2", year: "2010", phase: 1 },
    { x: 10, y: 8, title: "Thor", year: "2011", phase: 1 },
    { x: 30, y: -2, title: "Captain America", year: "2011", phase: 1 },
    { x: 60, y: 0, title: "The Avengers", year: "2012", phase: 1 },
    { x: 90, y: -10, title: "Iron Man 3", year: "2013", phase: 2 },
    { x: 120, y: 5, title: "Thor: Dark World", year: "2013", phase: 2 }
];

const nodesGroup = new THREE.Group();
scene.add(nodesGroup);

const lineMaterial = new THREE.LineBasicMaterial({ color: 0xe62429, transparent: true, opacity: 0.5 });
const nodeGeometry = new THREE.SphereGeometry(0.5, 32, 32);
const glowMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });

// Create Path
const points = movieNodes.map(n => new THREE.Vector3(n.x, n.y, 0));
const curve = new THREE.CatmullRomCurve3(points);
const curvePoints = curve.getPoints(200);
const geometry = new THREE.BufferGeometry().setFromPoints(curvePoints);
const line = new THREE.Line(geometry, lineMaterial);
nodesGroup.add(line);

// Add Nodes
movieNodes.forEach(node => {
    const mesh = new THREE.Mesh(nodeGeometry, glowMaterial);
    mesh.position.set(node.x, node.y, 0);
    nodesGroup.add(mesh);
    
    // Inner Glow
    const light = new THREE.PointLight(0xe62429, 2, 10);
    light.position.set(node.x, node.y, 0);
    nodesGroup.add(light);
});

camera.position.z = 50;

// Interactions
container.addEventListener('mousedown', (e) => {
    isDragging = true;
    startX = e.clientX;
});

window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const delta = e.clientX - startX;
    targetScrollX -= delta * 0.1;
    startX = e.clientX;
});

window.addEventListener('mouseup', () => isDragging = false);

container.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey) {
        targetZoom = Math.min(Math.max(targetZoom + e.deltaY * -0.01, 0.5), 3);
    } else {
        targetScrollX += e.deltaY * 0.1;
    }
}, { passive: false });

function animate() {
    requestAnimationFrame(animate);
    
    // Smooth Lerp
    scrollX += (targetScrollX - scrollX) * 0.1;
    zoom += (targetZoom - zoom) * 0.1;
    
    nodesGroup.position.x = -scrollX;
    camera.position.z = 50 / zoom;
    
    // Dynamic camera tilt
    camera.rotation.y = -scrollX * 0.001;
    camera.position.y = Math.sin(scrollX * 0.02) * 2;
    
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_14 -->
</body>
</html>
