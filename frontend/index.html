    <title>MarvelVerse</title>
    <script>
      (function(){try{var k='marvelverse-theme-mode',d='system',s=localStorage.getItem(k)||d,r=s;if(s==='system'){var m=window.matchMedia('(prefers-color-scheme: dark)'),c=window.matchMedia('(prefers-contrast: more)');r=c.matches?'high-contrast':(m.matches?'dark':'light');}document.documentElement.setAttribute('data-theme',r);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
    </script>
  </head>
